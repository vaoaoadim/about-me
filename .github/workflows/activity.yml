name: Refresh public contribution artwork
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.mjs
      - scripts/activity.test.mjs
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: public-activity-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test scripts/activity.test.mjs
      - run: node scripts/activity.mjs
      - name: Publish only generated artwork to the activity branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_INDEX_FILE="$(mktemp)"
          rm "$GIT_INDEX_FILE"
          git read-tree --empty
          for file in activity.svg activity-ru.svg; do
            blob=$(git hash-object -w "generated/$file")
            git update-index --add --cacheinfo "100644,$blob,$file"
          done
          tree=$(git write-tree)
          parent=()
          if git ls-remote --exit-code origin refs/heads/activity >/dev/null 2>&1; then
            git fetch origin activity
            previous=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$previous^{tree}")" = "$tree" ]; then
              echo 'Public activity is unchanged.'
              exit 0
            fi
            parent=(-p "$previous")
          fi
          commit=$(git commit-tree "$tree" "${parent[@]}" -m 'Refresh public contribution artwork')
          git push origin "$commit:refs/heads/activity"
